name: Playwright E2E

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Required by `gh pr merge --admin` for develop: E2E must pass before merging
# any feature branch into develop or develop into main.

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'
  ASPNETCORE_ENVIRONMENT: Development
  CI: 'true'

jobs:
  e2e:
    name: Playwright E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build backend
        working-directory: src/backend
        run: dotnet build Host/ERP-SYSTEM.csproj -c Release --nologo -v minimal

      - name: Start backend (background)
        working-directory: src/backend
        run: |
          # Sanitize secrets before use. The Supabase secrets were set with
          # `gh secret set` from a file, which corrupted them with trailing
          # characters (newlines, literal `\n`, spaces, etc.). .NET's
          # connection string parser then chokes on invalid Port values.
          # We use python here because it handles URL-decoding AND digit-only
          # filtering in one pass, which tr/sed can't do robustly.
          SUPABASE_HOST=$(python3 -c "import sys,urllib.parse; print(urllib.parse.unquote(sys.argv[1].strip()))" "${SUPABASE_HOST}")
          SUPABASE_PORT=$(python3 -c "import sys,urllib.parse; v=urllib.parse.unquote(sys.argv[1].strip()); print(''.join(c for c in v if c.isdigit()))" "${SUPABASE_PORT}")
          SUPABASE_DB=$(python3 -c "import sys,urllib.parse; print(urllib.parse.unquote(sys.argv[1].strip()))" "${SUPABASE_DB}")
          SUPABASE_USER=$(python3 -c "import sys,urllib.parse; print(urllib.parse.unquote(sys.argv[1].strip()))" "${SUPABASE_USER}")
          SUPABASE_PASSWORD=$(python3 -c "import sys,urllib.parse; print(urllib.parse.unquote(sys.argv[1].strip()))" "${SUPABASE_PASSWORD}")
          # DEBUG: print sanitized values (length only, since GitHub redacts the actual content)
          echo "DEBUG_SANITIZED_HOST_LEN=${#SUPABASE_HOST} _FIRST5=${SUPABASE_HOST:0:5} _LAST5=${SUPABASE_HOST: -5}"
          echo "DEBUG_SANITIZED_PORT_LEN=${#SUPABASE_PORT}"
          echo "DEBUG_SANITIZED_DB_LEN=${#SUPABASE_DB} _FIRST5=${SUPABASE_DB:0:5} _LAST5=${SUPABASE_DB: -5}"
          echo "DEBUG_SANITIZED_USER_LEN=${#SUPABASE_USER} _FIRST5=${SUPABASE_USER:0:5} _LAST5=${SUPABASE_USER: -5}"
          echo "DEBUG_SANITIZED_PASSWORD_LEN=${#SUPABASE_PASSWORD} _FIRST3=${SUPABASE_PASSWORD:0:3} _LAST3=${SUPABASE_PASSWORD: -3}"
          # URL-encode the password for safe inclusion in the connection string
          # (Npgsql treats &, #, !, and other special chars literally in the
          # password field). python3's urllib.quote is the standard encoder.
          SUPABASE_PASSWORD_ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1], safe=''))" "${SUPABASE_PASSWORD}")
          # Pass the connection string as an env var directly to dotnet run.
          # .NET's IConfiguration reads ConnectionStrings__Postgres from env,
          # so we skip writing a JSON file entirely (avoids heredoc + escaping
          # + envsubst brittleness).
          # Secrets expected: SUPABASE_HOST, SUPABASE_PORT, SUPABASE_DB, SUPABASE_USER, SUPABASE_PASSWORD
          export ConnectionStrings__Postgres="Host=${SUPABASE_HOST};Port=${SUPABASE_PORT};Database=${SUPABASE_DB};User Id=${SUPABASE_USER};Password=${SUPABASE_PASSWORD_ENC};SSL Mode=Require;Pooling=true;Minimum Pool Size=1;Maximum Pool Size=20;Connection Idle Lifetime=300;Keepalive=30;Timeout=15;Command Timeout=60"
          # Phase 6.3 hotfix (PR #149): derive the direct (port 5432) connection
          # from SUPABASE_USER. The pooler user is `postgres.<project_ref>` and
          # the direct host is `db.<project_ref>.supabase.co`. The direct
          # connection bypasses pgbouncer transaction-mode (which is hostile
          # to 40+ table DDL sequences — the migration stalls 5+ min on backend
          # acquire). User `postgres` (no suffix) for the direct connection.
          SUPABASE_PROJECT_REF=$(python3 -c "import re,sys;u=urllib.parse.unquote(sys.argv[1].strip()); m=re.match(r'postgres\.(.+)', u); print(m.group(1) if m else '')" "${SUPABASE_USER}")
          if [ -n "${SUPABASE_PROJECT_REF}" ]; then
            export ConnectionStrings__Migrations="Host=db.${SUPABASE_PROJECT_REF}.supabase.co;Port=5432;Database=${SUPABASE_DB};User Id=postgres;Password=${SUPABASE_PASSWORD_ENC};SSL Mode=Require;Pooling=false;Maximum Pool Size=1;Timeout=15;Command Timeout=60"
            echo "DEBUG_MIGRATIONS_HOST=db.${SUPABASE_PROJECT_REF}.supabase.co (project_ref=${SUPABASE_PROJECT_REF})"
          else
            echo "WARN: Could not extract project ref from SUPABASE_USER; migration will fall back to pgbouncer (slow)"
          fi
          export Database__AutoMigrate=true
          # Also write a minimal appsettings.Development.json so DataTypeHostedService
          # doesn't bail looking for the dev config file (it expects one even if empty).
          echo '{}' > Host/appsettings.Development.json
          nohup dotnet run --project Host/ERP-SYSTEM.csproj --no-launch-profile --urls http://localhost:5000 > /tmp/backend.log 2>&1 &
          echo "Backend PID: $!"
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}

      - name: Wait for backend health
        run: |
          # Allow up to 15 minutes for the backend to bind to port 5000.
          # The Phase 6.3 migration (40 tables + 80 FKs via the new 2-pass
          # architecture) plus DefaultHoldingBootstrap can take 5-8 min
          # on CI runner → Supabase transatlantic latency + cold-start.
          # 60 iterations × 2s (= 120s) was too tight; 300 × 2s = 600s
          # was still tight; bumped to 450 × 2s = 900s for safety.
          # Every 10s we dump the last 5 lines of the backend log for debug.
          for i in {1..450}; do
            if curl -sf http://localhost:5000/api/health/ready; then
              echo "Backend ready after ${i} attempts (~$((i*2))s)"
              exit 0
            fi
            # Every 10 iterations (~20s), dump a short log tail for debug
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- [health check t=$((i*2))s] backend.log tail ---"
              tail -n 5 /tmp/backend.log 2>/dev/null || echo "(no log yet)"
              echo "--- end tail ---"
            fi
            sleep 2
          done
          echo "Backend failed to start (timed out after 900s)"
          echo "--- full backend.log ---"
          cat /tmp/backend.log
          exit 1

      - name: Install frontend deps
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: src/frontend
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:5000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: src/frontend/test-results/
          retention-days: 7

      - name: Stop backend
        if: always()
        run: pkill -f 'dotnet run' || true
