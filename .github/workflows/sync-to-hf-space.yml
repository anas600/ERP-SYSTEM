name: Sync to Hugging Face Space

# شغّل عند push إلى develop أو main
on:
  push:
    branches:
      - main
      - develop
  # يمكن تشغيله يدوياً من Actions tab
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to sync to HF Space (main or develop)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop

# لا تشغّل workflows قديمة على نفس الـ PR
concurrency:
  group: sync-hf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to HF Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Filter files for HF Space
        # نحذف الملفات التي لا يحتاجها HF Space
        # (HF يبني Docker ولا يحتاج node_modules و .next)
        run: |
          echo "=== قبل التنظيف ==="
          du -sh .
          echo ""
          echo "=== تحويل Dockerfile.hf إلى Dockerfile أولاً (قبل أي حذف) ==="
          if [ -f "Dockerfile.hf" ]; then
            mv Dockerfile.hf Dockerfile
            echo "✅ Dockerfile.hf renamed to Dockerfile"
          else
            echo "⚠️ Dockerfile.hf not found - checking if Dockerfile already exists"
            ls -la Dockerfile* 2>&1 || true
          fi
          echo ""
          echo "=== تنظيف الملفات الزائدة ==="
          rm -rf node_modules
          rm -rf src/frontend/node_modules
          rm -rf src/frontend/.next
          rm -rf src/frontend/.out
          rm -rf src/frontend/build
          rm -rf src/backend/Host/bin
          rm -rf src/backend/Host/obj
          rm -rf src/backend/Tests/bin
          rm -rf src/backend/Tests/obj
          rm -rf docs
          rm -rf infra
          rm -rf .github
          rm -rf .mavis
          rm -rf .vs .vscode
          # حذف ملفات Windows/sandbox غير ضرورية
          rm -f *.pdf
          rm -f "New Text Document.txt"
          rm -f "restart-backend.ps1"
          rm -f "star-stop-sys.bas"
          rm -f "start-dev.ps1"
          rm -f "stop-dev.ps1"
          echo ""
          echo "=== بعد التنظيف ==="
          du -sh .
          echo ""
          echo "=== عدد الملفات ==="
          find . -type f | wc -l
          echo ""
          echo "=== التحقق من وجود Dockerfile ==="
          ls -la Dockerfile 2>&1 || echo "❌ Dockerfile مفقود!"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          SPACE_NAME: ${{ secrets.SPACE_NAME }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || github.ref_name }}
        run: |
          # تأكد من أن المتغيرات موجودة
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ] || [ -z "$SPACE_NAME" ]; then
            echo "ERROR: HF_TOKEN, HF_USERNAME, or SPACE_NAME secrets are not set!"
            echo "Please add them in Settings → Secrets and variables → Actions"
            exit 1
          fi

          # إعداد git user (لـ HF)
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # إضافة HF Space كـ remote
          git remote add space "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME}"

          # عرض الـ remote URLs
          echo "=== Remotes ==="
          git remote -v

          # 1) push إلى HF Space باستخدام git (لـ history)
          echo ""
          echo "=== Pushing to HF Space: ${HF_USERNAME}/${SPACE_NAME} (branch: ${TARGET_BRANCH}) ==="
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME}" "HEAD:${TARGET_BRANCH}" 2>&1

      - name: Clean up old files in HF Space (using HF API)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          SPACE_NAME: ${{ secrets.SPACE_NAME }}
        run: |
          # نستخدم HF API لحذف الملفات القديمة التي لم تعد في local
          # (git push --force لا يحذف files في remote غير موجودة في local)
          echo "=== حذف الملفات القديمة من HF Space ==="

          # Files to delete
          FILES_TO_DELETE=(
            "Dockerfile.hf"
            ".mavis"
            "docs"
            "infra"
            "New Text Document.txt"
            "restart-backend.ps1"
            "star-stop-sys.bas"
            "start-dev.ps1"
            "stop-dev.ps1"
          )

          for FILE in "${FILES_TO_DELETE[@]}"; do
            echo "Deleting: $FILE"
            curl -s -X DELETE \
              -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/api/spaces/${HF_USERNAME}/${SPACE_NAME}/resolve/main/${FILE}" \
              || echo "  (not found or error)"
          done

          echo ""
          echo "=== التحقق من الملفات المتبقية ==="
          curl -s \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/${HF_USERNAME}/${SPACE_NAME}/tree/main" \
            | head -30

      - name: Summary
        if: success()
        run: |
          echo "✅ Successfully synced to Hugging Face Space"
          echo "🔗 Check status at: https://huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME}"
