name: Secrets Scan (TruffleHog)

# Improvement 5: Security scanning (DEC-061).
# Scans git history + working tree for committed secrets
# (API keys, tokens, passwords, private keys, etc.).

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '0 7 * * 1'  # Weekly Monday 7 AM UTC (after CodeQL)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: TruffleHog OSS Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --directory=. --only-verified --no-update
          # --only-verified: only report confirmed secrets (no false positives)
          # --no-update: don't try to update the TruffleHog image (faster)

      - name: TruffleHog Git History Scan
        if: always()
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --directory=. --only-verified --no-update --print-avg-detector-time