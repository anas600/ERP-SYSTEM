name: CI Fast (Tests + Lint, No Deploy)

# DEC-054 + v1.8.2: Fast feedback loop.
# Runs unit tests + lint + architecture checks on every PR.
# NO deploy (deploy is in ci-deploy-prod.yml).
# Heavy DB integration tests (Retention, Edge) are SKIPPED here — see nightly-integration.yml.
#
# This is the new Layer 1 (DEVELOPMENT) of the 3-layer model.
#   - Layer 1: develop (this workflow) — fast feedback
#   - Layer 2: nightly integration tests
#   - Layer 3: main (ci-deploy-prod.yml) — production with manual approval
#
# Test reduction strategy:
#   - Skip Category=Retention (32 tests, slow, needs special test DB)
#   - Skip Category=Edge (subset of Retention)
#   - CI runs: 446 → ~414 tests, ~3-5 min faster
#   - Full suite runs nightly (nightly-integration.yml)

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'

jobs:
  # ===================================================================
  # Architecture compliance (fast, no build needed)
  # ===================================================================
  architecture-compliance:
    name: Architecture Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for tenant_id (Constitution Article 3)
        run: |
          if grep -r "tenant_id" src/ --include="*.cs" --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "❌ FOUND tenant_id references in source code"
            exit 1
          else
            echo "✅ No tenant_id references"
          fi

      - name: Check for EF Core (Rule 6)
        run: |
          if grep -rE "Microsoft\.EntityFrameworkCore" src/backend/ --include="*.csproj" 2>/dev/null; then
            echo "❌ FOUND EF Core references"
            exit 1
          else
            echo "✅ No EF Core"
          fi

      - name: Check for hardcoded secrets
        run: |
          if grep -rE "password\s*=\s*['\"]" src/ --include="*.cs" --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "❌ FOUND hardcoded passwords"
            exit 1
          else
            echo "✅ No hardcoded secrets"
          fi

  # ===================================================================
  # Backend: unit tests only (NO DB integration)
  # ===================================================================
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: architecture-compliance
    defaults:
      run:
        working-directory: src/backend
    services:
      # NOTE: We skip Postgres in CI fast — unit tests use FakeDbConnectionFactory (in-memory).
      # Postgres is only needed for Retention/Edge tests (run in nightly-integration.yml).
      # We DO need Redis for any test that uses caching — see Redis service below.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=erp_test_system;Username=erp_test;Password=erp_test_pw"
      ConnectionStrings__Redis: "localhost:6379"
      JwtSettings__Secret: "CI_FAST_TEST_SECRET_REPLACE_32CHARS_xxxxxxxxxxxxxx"
      Database__AutoMigrate: "false"  # Disable in CI fast — no DB tests run

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Backend
        run: dotnet restore Host/ERP-SYSTEM.csproj

      - name: Restore Tests
        run: dotnet restore Tests/ERPSystem.Tests/ERPSystem.Tests.csproj

      - name: Build Backend (fast-fail on compile errors)
        run: dotnet build Host/ERP-SYSTEM.csproj --no-restore --configuration Release

      - name: Build Tests
        run: dotnet build Tests/ERPSystem.Tests/ERPSystem.Tests.csproj --no-restore --configuration Release

      # v1.8.2 test reduction: skip Retention + Edge (run nightly instead)
      - name: Run unit tests (filter out Retention + Edge categories)
        run: |
          dotnet test Tests/ERPSystem.Tests/ERPSystem.Tests.csproj \
            --no-build --configuration Release \
            --filter "Category!=Retention&Category!=Edge" \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ci-fast
          path: '**/TestResults/**/*.trx'

  # ===================================================================
  # Frontend: type-check + lint + build (runs in parallel with backend)
  # ===================================================================
  frontend-build:
    name: Frontend Build (Next.js 14)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: architecture-compliance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (fast-fail)
        run: npm run type-check

      - name: Lint (fast-fail)
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:5000'

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/.next/standalone/
          retention-days: 3
