# DEC-067: Daily status report
# Runs every day at 23:00 UTC, generates Markdown report + Telegram summary.

name: Daily Status Report

on:
  schedule:
    - cron: '0 23 * * *'  # 23:00 UTC daily
  workflow_dispatch:

concurrency:
  group: daily-status
  cancel-in-progress: false

jobs:
  report:
    name: Generate Daily Report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install psycopg2
        run: pip install --quiet psycopg2-binary

      - name: Make script executable
        run: chmod +x scripts/daily-status-report.py

      - name: Generate report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ secrets.GITHUB_REPO || 'anas600/ERP-SYSTEM' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OUTPUT_DIR: /tmp
        run: python scripts/daily-status-report.py | tee /tmp/daily-status-run.log

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ env.TODAY }}
          path: /tmp/daily-report-*.md
          retention-days: 90

      - name: Commit report to repo (archive)
        continue-on-error: true
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p docs/daily-reports
          cp /tmp/daily-report-${TODAY}.md docs/daily-reports/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/daily-reports/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: daily report $TODAY"
          git push

      - name: Notify on success
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}&text=📊 Daily status report generated" > /dev/null || true
          fi
