# DEC-052 P2: Monthly retention report cron
# Generates CSV report on 1st of each month, uploads as artifact.

name: Retention Report (Monthly)

on:
  schedule:
    - cron: '0 5 1 * *'  # 05:00 UTC on 1st of month
  workflow_dispatch:

concurrency:
  group: retention-report
  cancel-in-progress: false

jobs:
  report:
    name: Generate Retention Report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Run report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: bash scripts/retention-report.sh

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: retention-report-${{ env.REPORT_DATE }}
          path: /tmp/retention-report-*.csv
          retention-days: 365  # Keep 1 year of reports

      - name: Notify
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            MSG="📊 Monthly retention report ready: ${{ env.REPORT_DATE }}"
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}&text=${MSG}" > /dev/null || true
          fi
